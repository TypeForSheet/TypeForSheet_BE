spring:
  application:
    name: type-for-sheet-backend
  profiles:
    default: local
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 30
    issuer: typeforsheet

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    kakao:
      app-id: ${KAKAO_APP_ID:}
    apple:
      client-ids: ${APPLE_CLIENT_IDS:}
