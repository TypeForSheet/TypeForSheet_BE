language: ko-KR

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  assess_linked_issues: true
  suggested_labels: true
  auto_apply_labels: false
  path_filters:
    - "!build/**"
    - "!**/generated/**"
  path_instructions:
    - path: "src/main/java/**/*.java"
      instructions: |
        Controller-Service-Repository 간 책임 분리를 확인합니다.
        입력값 검증, 예외 처리, 트랜잭션 범위를 확인합니다.
        Entity가 API 응답으로 직접 노출되지 않는지 확인합니다.
    - path: "src/test/**/*.java"
      instructions: |
        핵심 성공 및 실패 시나리오가 검증되는지 확인합니다.
        구현 세부사항보다 외부 동작을 검증하는지 확인합니다.
