name: Task
description: 설정, 문서화, 리팩토링 등의 작업을 등록합니다.
title: "[CHORE] "
body:
  - type: dropdown
    id: type
    attributes:
      label: 작업 유형
      options:
        - CHORE
        - DOCS
        - REFACTOR
        - DELETE
        - HOTFIX
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 작업 설명
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목
      value: |
        - [ ]
    validations:
      required: true
