
name: Add MUBLE PR prefix

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  add-prefix:
    name: Sync PR title with linked issue
    runs-on: ubuntu-latest

    steps:
      - name: Update PR title
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            const { data: pr } =
              await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });

            const body = pr.body || "";

            const issueMatch = body.match(
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)\b/i
            );

            if (!issueMatch) {
              core.setFailed(
                "PR body must contain Closes #issue-number."
              );
              return;
            }

            const issueNumber = Number(issueMatch[1]);

            const { data: issue } =
              await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });

            if (issue.pull_request) {
              core.setFailed(
                "Linked number refers to a PR, not an Issue."
              );
              return;
            }

            // 기존 TFS와 신규 MUBLE Issue 모두 인식
            const issueTitleMatch = issue.title.match(
              /^\[(?:MUBLE|TFS)-(\d+)\]\s+\[(FEAT|FIX|HOTFIX|CHORE|DELETE|DOCS|REFACTOR)\]\s+(.+)$/i
            );

            if (!issueTitleMatch) {
              core.setFailed(
                "Linked Issue must have a valid TFS or MUBLE prefix."
              );
              return;
            }

            const ticketNumber = Number(issueTitleMatch[1]);
            const issueType = issueTitleMatch[2].toUpperCase();
            const issueSummary = issueTitleMatch[3];

            const branchMatch = pr.head.ref.match(
              /^(feat|fix|hotfix|chore|delete|docs|refactor)\/(?:MUBLE|TFS)-(\d+)$/
            );

            if (!branchMatch) {
              core.setFailed(
                "Invalid branch name."
              );
              return;
            }

            const branchType = branchMatch[1].toUpperCase();
            const branchNumber = Number(branchMatch[2]);

            if (branchNumber !== ticketNumber) {
              core.setFailed(
                "Branch ticket number does not match linked Issue."
              );
              return;
            }

            if (branchType !== issueType) {
              core.setFailed(
                "Branch type does not match linked Issue type."
              );
              return;
            }

            // PR 제목은 항상 MUBLE 접두사 사용
            const newTitle =
              `[MUBLE-${ticketNumber}] [${issueType}] ${issueSummary}`;

            if (pr.title === newTitle) {
              core.info("PR title already synchronized.");
              return;
            }

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: prNumber,
              title: newTitle,
            });

            core.info(`PR title updated: ${newTitle}`);
