
name: Add TFS issue prefix

on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: tfs-issue-numbering
  cancel-in-progress: false

jobs:
  add-prefix:
    runs-on: ubuntu-latest

    steps:
      - name: Add TFS number to issue title
        uses: actions/github-script@v8
        with:
          script: |
            const currentIssue = context.payload.issue;

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100,
              }
            );

            const existingNumbers = issues
              .filter(item =>
                !item.pull_request &&
                item.number !== currentIssue.number
              )
              .map(item => {
                const match = item.title.match(/^\[TFS-(\d+)\]/);
                return match ? Number(match[1]) : 0;
              });

            const nextNumber =
              Math.max(0, ...existingNumbers) + 1;

            const prefix = `[TFS-${nextNumber}]`;

            const cleanTitle = currentIssue.title
              .replace(/^\[TFS-\d+\]\s*/, '')
              .trim();

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: currentIssue.number,
              title: `${prefix} ${cleanTitle}`,
            });
