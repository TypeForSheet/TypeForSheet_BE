
name: Add TFS issue prefix

on:
  issues:
    types: [opened, edited]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: tfs-issue-numbering
  queue: max
  cancel-in-progress: false

jobs:
  add-prefix:
    name: Assign TFS issue numbers
    runs-on: ubuntu-latest

    steps:
      - name: Assign or restore TFS prefixes
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const getNumber = (title) => {
              const match = title.match(/^\[TFS-(\d+)\]/);

              if (!match) {
                return null;
              }

              const number = Number(match[1]);

              return Number.isSafeInteger(number) && number > 0
                ? number
                : null;
            };

            const hasPrefix = (title) =>
              /^\[TFS-\d+\]/.test(title);

            const allItems = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "all",
                per_page: 100,
              }
            );

            const issues = allItems
              .filter(item => !item.pull_request)
              .sort((a, b) => a.number - b.number);

            // TFS 번호 -> GitHub Issue 번호
            const reserved = new Map();

            // GitHub Issue 번호 -> 과거 TFS 번호
            const historicalNumbers = new Map();

            // 현재 제목에 있는 유효한 번호를 먼저 예약한다.
            for (const issue of issues) {
              const number = getNumber(issue.title);

              if (number === null) {
                if (hasPrefix(issue.title)) {
                  core.warning(
                    `Issue #${issue.number} has an unsafe TFS number.`
                  );
                }
                continue;
              }

              if (
                reserved.has(number) &&
                reserved.get(number) !== issue.number
              ) {
                core.warning(
                  `Duplicate TFS-${number} found.`
                );
                continue;
              }

              reserved.set(number, issue.number);
            }

            // 접두사가 사라진 이슈는 제목 변경 이력에서
            // 이전에 사용하던 번호를 확인한다.
            for (const issue of issues) {
              if (hasPrefix(issue.title)) {
                continue;
              }

              const events = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                {
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100,
                }
              );

              let previousNumber = null;

              for (const event of events) {
                if (event.event !== "renamed") {
                  continue;
                }

                const titles = [
                  event.rename?.to,
                  event.rename?.from,
                ];

                for (const title of titles) {
                  if (typeof title !== "string") {
                    continue;
                  }

                  const number = getNumber(title);

                  if (number !== null) {
                    previousNumber = number;
                    break;
                  }
                }

                if (previousNumber !== null) {
                  break;
                }
              }

              if (previousNumber === null) {
                continue;
              }

              if (
                reserved.has(previousNumber) &&
                reserved.get(previousNumber) !== issue.number
              ) {
                core.warning(
                  `TFS-${previousNumber} is already assigned.`
                );
                continue;
              }

              historicalNumbers.set(
                issue.number,
                previousNumber
              );

              reserved.set(
                previousNumber,
                issue.number
              );
            }

            let nextNumber =
              Math.max(0, ...reserved.keys()) + 1;

            for (const item of issues) {
              if (hasPrefix(item.title)) {
                continue;
              }

              // 항상 최신 이슈 제목을 사용한다.
              const { data: latest } =
                await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: item.number,
                });

              // 목록 조회 이후 제목이 변경됐다면
              // 덮어쓰지 않고 다음 실행에서 재검토한다.
              if (
                latest.title !== item.title ||
                latest.updated_at !== item.updated_at
              ) {
                core.info(
                  `Issue #${item.number} changed. Skipping.`
                );
                continue;
              }

              if (hasPrefix(latest.title)) {
                continue;
              }

              let ticketNumber =
                historicalNumbers.get(item.number);

              if (ticketNumber === undefined) {
                while (reserved.has(nextNumber)) {
                  nextNumber++;
                }

                ticketNumber = nextNumber;
              }

              if (
                reserved.has(ticketNumber) &&
                reserved.get(ticketNumber) !== item.number
              ) {
                core.warning(
                  `Issue #${item.number}: number conflict.`
                );
                continue;
              }

              // 업데이트 직전 변경 여부를 한 번 더 확인한다.
              const { data: beforeWrite } =
                await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: item.number,
                });

              if (
                beforeWrite.title !== latest.title ||
                beforeWrite.updated_at !== latest.updated_at
              ) {
                core.info(
                  `Issue #${item.number} was edited. Skipping.`
                );
                continue;
              }

              const cleanTitle = beforeWrite.title.trim();

              const newTitle =
                `[TFS-${ticketNumber}] ${cleanTitle}`;

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: item.number,
                title: newTitle,
              });

              reserved.set(ticketNumber, item.number);

              if (ticketNumber === nextNumber) {
                nextNumber++;
              }

              core.info(
                `Issue #${item.number}: ${newTitle}`
              );
            }
