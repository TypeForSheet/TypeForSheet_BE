
name: Add TFS issue prefix

on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: tfs-issue-numbering
  queue: max
  cancel-in-progress: false

jobs:
  add-prefix:
    name: Add TFS number to issue title
    runs-on: ubuntu-latest

    steps:
      - name: Assign missing TFS numbers
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // PR은 제외하고 전체 Issue를 조회한다.
            const allItems = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "all",
                per_page: 100,
              }
            );

            const issues = allItems
              .filter(item => !item.pull_request)
              .sort((a, b) => a.number - b.number);

            const usedNumbers = new Set();

            for (const issue of issues) {
              const match = issue.title.match(
                /^\[TFS-(\d+)\]/
              );

              if (match) {
                usedNumbers.add(Number(match[1]));
              }
            }

            let nextNumber =
              Math.max(0, ...usedNumbers) + 1;


            for (const item of issues) {
              const { data: latestIssue } =
                await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: item.number,
                });


              const existingPrefix =
                latestIssue.title.match(
                  /^\[TFS-(\d+)\]/
                );

              if (existingPrefix) {
                core.info(
                  `Issue #${item.number} already numbered.`
                );
                continue;
              }

              while (usedNumbers.has(nextNumber)) {
                nextNumber++;
              }

              const cleanTitle = latestIssue.title
                .replace(/^\[TFS-\d+\]\s*/, "")
                .trim();

              const newTitle =
                `[TFS-${nextNumber}] ${cleanTitle}`;

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: item.number,
                title: newTitle,
              });

              usedNumbers.add(nextNumber);

              core.info(
                `Issue #${item.number}: ${newTitle}`
              );

              nextNumber++;
            }
