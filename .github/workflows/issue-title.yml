
name: Add MUBLE issue prefix

on:
  issues:
    types: [opened, edited]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: muble-issue-numbering
  queue: max
  cancel-in-progress: false

jobs:
  add-prefix:
    name: Assign MUBLE issue numbers
    runs-on: ubuntu-latest

    steps:
      - name: Assign or restore MUBLE prefixes
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const getNumber = (title) => {
              const match = title.match(
                /^\[(?:MUBLE|TFS)-(\d+)\]/
              );

              if (!match) return null;

              const number = Number(match[1]);

              return Number.isSafeInteger(number) && number > 0
                ? number
                : null;
            };

            const hasPrefix = (title) =>
              /^\[(?:MUBLE|TFS)-\d+\]/.test(title);

            const allItems = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "all",
                per_page: 100,
              }
            );

            // PR은 작업 번호 발급 대상에서 제외
            const issues = allItems
              .filter(item => !item.pull_request)
              .sort((a, b) => a.number - b.number);

            // 작업 번호 -> GitHub Issue 번호
            const reserved = new Map();

            // GitHub Issue 번호 -> 복구할 작업 번호
            const historicalNumbers = new Map();
            const conflicts = new Set();

            // 기존 TFS/MUBLE 번호를 우선 예약
            for (const issue of issues) {
              const number = getNumber(issue.title);

              if (number === null) {
                if (hasPrefix(issue.title)) {
                  core.warning(
                    `Issue #${issue.number} has an invalid prefix.`
                  );
                  conflicts.add(issue.number);
                }
                continue;
              }

              if (
                reserved.has(number) &&
                reserved.get(number) !== issue.number
              ) {
                core.warning(
                  `Duplicate ticket number ${number}: ` +
                  `Issues #${reserved.get(number)} and #${issue.number}`
                );
                conflicts.add(issue.number);
                continue;
              }

              reserved.set(number, issue.number);
            }

            // 접두사가 제거된 Issue의 과거 번호 복구
            for (const issue of issues) {
              if (
                hasPrefix(issue.title) ||
                conflicts.has(issue.number)
              ) {
                continue;
              }

              const events = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                {
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100,
                }
              );

              let previousNumber = null;

              for (const event of events) {
                if (event.event !== "renamed") continue;

                for (const title of [
                  event.rename?.to,
                  event.rename?.from,
                ]) {
                  if (typeof title !== "string") continue;

                  const number = getNumber(title);

                  if (number !== null) {
                    previousNumber = number;
                    break;
                  }
                }

                if (previousNumber !== null) break;
              }

              if (previousNumber === null) continue;

              if (
                reserved.has(previousNumber) &&
                reserved.get(previousNumber) !== issue.number
              ) {
                core.warning(
                  `Historical number conflict for Issue #${issue.number}`
                );
                conflicts.add(issue.number);
                continue;
              }

              historicalNumbers.set(
                issue.number,
                previousNumber
              );

              reserved.set(
                previousNumber,
                issue.number
              );
            }

            // GitHub Issue 번호가 아닌 마지막 작업 번호 기준
            let nextNumber =
              Math.max(0, ...reserved.keys()) + 1;

            for (const item of issues) {
              if (conflicts.has(item.number)) continue;

              const { data: latest } =
                await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: item.number,
                });

              // 동시 수정된 Issue는 건드리지 않음
              if (
                latest.title !== item.title ||
                latest.updated_at !== item.updated_at
              ) {
                core.info(
                  `Issue #${item.number} changed. Skipping.`
                );
                continue;
              }

              let ticketNumber = getNumber(latest.title);

              if (ticketNumber === null) {
                ticketNumber =
                  historicalNumbers.get(item.number);
              }

              if (ticketNumber === undefined ||
                  ticketNumber === null) {
                while (reserved.has(nextNumber)) {
                  nextNumber++;
                }

                ticketNumber = nextNumber;
              }

              if (
                reserved.has(ticketNumber) &&
                reserved.get(ticketNumber) !== item.number
              ) {
                core.warning(
                  `Number conflict for Issue #${item.number}`
                );
                continue;
              }

              const cleanTitle = latest.title
                .replace(
                  /^\[(?:MUBLE|TFS)-\d+\]\s*/,
                  ""
                )
                .trim();

              if (!cleanTitle) {
                core.warning(
                  `Empty title for Issue #${item.number}`
                );
                continue;
              }

              const newTitle =
                `[MUBLE-${ticketNumber}] ${cleanTitle}`;

              if (latest.title === newTitle) {
                reserved.set(ticketNumber, item.number);
                continue;
              }

              // 업데이트 직전에도 변경 여부 확인
              const { data: beforeWrite } =
                await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: item.number,
                });

              if (
                beforeWrite.title !== latest.title ||
                beforeWrite.updated_at !== latest.updated_at
              ) {
                core.info(
                  `Issue #${item.number} was edited. Skipping.`
                );
                continue;
              }

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: item.number,
                title: newTitle,
              });

              reserved.set(ticketNumber, item.number);

              if (ticketNumber === nextNumber) {
                nextNumber++;
              }

              core.info(
                `Issue #${item.number}: ${newTitle}`
              );
            }

            if (conflicts.size > 0) {
              core.warning(
                `${conflicts.size} issue(s) need number review.`
              );
            }
