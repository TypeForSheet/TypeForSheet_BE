
name: Convention Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read

jobs:
  branch-name:
    name: Branch Name Check
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch and linked issue
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const headBranch = pr.head.ref;
            const baseBranch = pr.base.ref;

            if (baseBranch === "main") {
              if (
                headBranch !== "dev" &&
                !/^hotfix\/(?:MUBLE|TFS)-\d+$/.test(headBranch)
              ) {
                core.setFailed(
                  "Only dev or hotfix branches can target main."
                );
                return;
              }

              core.info("Main branch convention passed.");
              return;
            }

            if (baseBranch !== "dev") {
              core.info("No convention configured for target branch.");
              return;
            }

            const branchMatch = headBranch.match(
              /^(feat|fix|hotfix|chore|delete|docs|refactor)\/(?:MUBLE|TFS)-(\d+)$/
            );

            if (!branchMatch) {
              core.setFailed(
                "Invalid branch name. Required: {type}/MUBLE-{ticket-number}"
              );
              return;
            }

            const branchType = branchMatch[1].toUpperCase();
            const branchNumber = Number(branchMatch[2]);

            const body = pr.body || "";

            const issueMatch = body.match(
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)\b/i
            );

            if (!issueMatch) {
              core.setFailed(
                "PR body must include Closes #issue-number."
              );
              return;
            }

            const issueNumber = Number(issueMatch[1]);

            const { data: issue } =
              await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

            if (issue.pull_request) {
              core.setFailed(
                "Linked number is not an Issue."
              );
              return;
            }

            // 리브랜딩 전환 중에는 TFS/MUBLE 모두 허용
            const titleMatch = issue.title.match(
              /^\[(?:MUBLE|TFS)-(\d+)\]\s+\[(FEAT|FIX|HOTFIX|CHORE|DELETE|DOCS|REFACTOR)\]\s+.+$/i
            );

            if (!titleMatch) {
              core.setFailed(
                "Linked Issue must have a valid TFS or MUBLE prefix."
              );
              return;
            }

            const ticketNumber = Number(titleMatch[1]);
            const issueType = titleMatch[2].toUpperCase();

            if (branchNumber !== ticketNumber) {
              core.setFailed(
                `Branch ticket ${branchNumber} does not match ` +
                `linked Issue ticket ${ticketNumber}.`
              );
              return;
            }

            if (branchType !== issueType) {
              core.setFailed(
                `Branch type ${branchType} does not match ` +
                `Issue type ${issueType}.`
              );
              return;
            }

            core.info(
              `Convention passed: MUBLE-${ticketNumber}`
            );
