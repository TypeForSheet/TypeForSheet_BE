
name: Convention Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  branch-name:
    name: Branch Name Check
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch and pull request title
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$BASE_BRANCH" == "dev" ]]; then
            if [[ ! "$HEAD_BRANCH" =~ ^(feat|fix|hotfix|chore|delete|docs|refactor)/TFS-([0-9]+)$ ]]; then
              echo "Invalid branch name: $HEAD_BRANCH"
              echo "Required: {type}/TFS-{ticket-number}"
              exit 1
            fi

            BRANCH_NUMBER="${BASH_REMATCH[2]}"

            if [[ ! "$PR_TITLE" =~ ^\[TFS-([0-9]+)\]\ \[(FEAT|FIX|HOTFIX|CHORE|DELETE|DOCS|REFACTOR)\]\ .+ ]]; then
              echo "Invalid PR title: $PR_TITLE"
              echo "Required: [TFS-4] [FEAT] summary"
              exit 1
            fi

            TITLE_NUMBER="${BASH_REMATCH[1]}"
            TITLE_TYPE="${BASH_REMATCH[2]}"

            if [[ "$BRANCH_NUMBER" != "$TITLE_NUMBER" ]]; then
              echo "Branch and PR ticket numbers do not match."
              exit 1
            fi

            BRANCH_TYPE="${HEAD_BRANCH%%/*}"

            if [[ "${BRANCH_TYPE^^}" != "$TITLE_TYPE" ]]; then
              echo "Branch and PR types do not match."
              exit 1
            fi
          fi

          if [[ "$BASE_BRANCH" == "main" ]]; then
            if [[ "$HEAD_BRANCH" != "dev" ]] && [[ ! "$HEAD_BRANCH" =~ ^hotfix/TFS-[0-9]+$ ]]; then
              echo "Only dev or hotfix/TFS-{number} can target main."
              exit 1
            fi
          fi

          echo "Convention check passed."
