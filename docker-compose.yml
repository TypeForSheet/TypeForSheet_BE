services:
  mysql:
    image: mysql:8.4
    container_name: typeforsheet-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-typeforsheet}
      MYSQL_USER: ${DB_USERNAME:-typeforsheet}
      MYSQL_PASSWORD: ${DB_PASSWORD:-typeforsheet}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
